<script src="config.js"></script>
<script src="products.js"></script>
<script>
(function () {
  function esc(value){
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function waLinkFor(location, customMessage){
    const base = customMessage || CONFIG.business.whatsappMessage;
    const message = `${base} (${location.name})`;
    return `https://wa.me/${location.whatsappNumber}?text=${encodeURIComponent(message)}`;
  }

  const picker = document.getElementById("location-picker");
  const pickerOptions = document.getElementById("location-picker-options");
  let lastFocus = null;

  function renderPickerOptions(customMessage){
    pickerOptions.innerHTML = CONFIG.locations.map((location) => `
      <a class="location-option" href="${esc(waLinkFor(location, customMessage))}" target="_blank" rel="noopener">
        <span class="location-option-name">${esc(location.name)}</span>
        <span class="location-option-meta">${esc(location.phoneDisplay)}</span>
        ${location.address !== location.name ? `<span class="location-option-meta">${esc(location.address)}</span>` : ""}
      </a>
    `).join("");
  }
  renderPickerOptions();

  function closePicker(){
    if (picker.hidden) return;
    picker.hidden = true;
    picker.setAttribute("aria-hidden", "true");
    document.body.classList.remove("picker-open");
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }

  function openPicker(trigger, customMessage){
    lastFocus = trigger || document.activeElement;
    renderPickerOptions(customMessage || null);
    const hint = document.getElementById("location-picker-hint");
    if (hint){
      hint.textContent = customMessage
        ? "Elegí la sucursal para enviar el pedido por WhatsApp."
        : "Te abrimos WhatsApp con la sucursal que elijas.";
    }
    picker.hidden = false;
    picker.setAttribute("aria-hidden", "false");
    document.body.classList.add("picker-open");
    const first = pickerOptions.querySelector("a");
    if (first) first.focus();
  }
  window.openLocationPicker = openPicker;

  document.addEventListener("click", (event) => {
    if (event.target.closest("#nav-whatsapp")){
      openPicker(event.target.closest("#nav-whatsapp"));
      return;
    }
    if (event.target.closest("#location-picker-close, #location-picker-backdrop")) closePicker();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePicker();
  });

  if (window.ProductsUI){
    ProductsUI.initCartUI();
    ProductsUI.initCatalogPage();
  }

  document.title = `${(CONFIG.ui && CONFIG.ui.catalogTitle) || "Productos"} · 0101 Barbershop`;
})();
</script>
</body>
</html>
